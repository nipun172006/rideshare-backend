server.port=8081
spring.application.name=rideshare

# MongoDB connection
# Use Atlas or any external DB by setting MONGODB_URI, fallback to local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rideshare}
# Optionally set explicit database if your URI omits it
spring.data.mongodb.database=${MONGODB_DATABASE:rideshare}

# JWT settings (use env for secrets in real deployments)
security.jwt.secret=${JWT_SECRET:change-me-super-secret-key-256-bit-min}
security.jwt.expiration-seconds=${JWT_EXP_SECONDS:36000}

# Logging (optional minimal)
logging.level.org.springframework.security=INFO
logging.level.org.example.rideshare=INFO
spring.application.name=rideshare
server.port=8081
